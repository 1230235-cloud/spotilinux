name: MaoMusic CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit Tests
        run: |
          python -m unittest tests/test_core.py -v
          python -m unittest tests/test_storage.py -v

  build-linux:
    name: Build Linux Native Binary
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & GCC
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc zip libgl1-mesa-glx
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Linux Binary
        run: |
          python build_linux_binary.py

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaoMusic-Linux-x86_64
          path: dist/MaoMusic
          retention-days: 7

  build-android:
    name: Build Android APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign
          # Instalar d8 y apksigner de build-tools oficiales
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compile and Sign APK
        env:
          ANDROID_SDK_DIR: ${{ github.workspace }}/.android-sdk
        run: |
          # Enlazar herramientas del sistema o SDK instalado
          if [ -f build_android_apk.sh ]; then
            chmod +x build_android_apk.sh
            # Si no existe .android-sdk local, vincular el instalado en el runner
            if [ ! -d ".android-sdk" ]; then
              ln -s $HOME/android-sdk .android-sdk
            fi
            ./build_android_apk.sh
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaoMusic-Android-APK
          path: dist/MaoMusic.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: MaoMusic-Linux-x86_64
          path: release_dist/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: MaoMusic-Android-APK
          path: release_dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/MaoMusic
            release_dist/MaoMusic.apk
          generate_release_notes: true
